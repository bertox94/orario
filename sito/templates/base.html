<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titolo %}Orario{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='stile.css') }}">
</head>
<body>
<main>
  <nav class="schede">
    <a href="{{ url_for('indice') }}" class="{{ 'attiva' if not request.path.startswith('/notturni') }}">Test in tempo reale</a>
    <a href="{{ url_for('pagina_notturni') }}" class="{{ 'attiva' if request.path.startswith('/notturni') }}">Test notturni</a>
  </nav>
  {% for m in get_flashed_messages() %}<p class="messaggio">{{ m }}</p>{% endfor %}
  {% block contenuto %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
