<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titolo %}Orario{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='stile.css') }}">
</head>
<body>
<main>
  <header class="testata">
    <a class="nome" href="{{ url_for('indice') }}">Orario scolastico</a>
    <nav class="schede">
      <a href="{{ url_for('indice') }}" class="{{ 'attiva' if not request.path.startswith('/notturni') }}">Prove</a>
      <a href="{{ url_for('pagina_notturni') }}" class="{{ 'attiva' if request.path.startswith('/notturni') }}">Test notturni</a>
    </nav>
  </header>
  {% for m in get_flashed_messages() %}<p class="messaggio">{{ m }}</p>{% endfor %}
  {% block contenuto %}{% endblock %}
</main>
<script>
// quello che serve a tutte le pagine
const numero = n => Number(n).toLocaleString('it-IT');
const esc = x => String(x).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
// una data e un'ora brevi, da un tempo in secondi
const quando = t => new Date(t * 1000).toLocaleString('it-IT', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
// l'etichetta colorata di un esito
const etichetta = esito => `<span class="esito esito-${esc(esito.replace(/ /g, '-'))}">${esc(esito)}</span>`;
</script>
{% block script %}{% endblock %}
</body>
</html>
